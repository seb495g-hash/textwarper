<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markup Text Studio</title>
<style>
:root{--bg:#0d0e12;--panel:#15161c;--line:#272a35;--fg:#e6e8f0;--mut:#8a8fa3;--acc:#8aa4ff;--paper:#1a1b21;--ink:#e9e9ef;--squig:#fff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
#tb{background:var(--panel);border-bottom:1px solid var(--line);padding:6px 10px;display:flex;flex-direction:column;gap:4px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:3px}
.row i{width:1px;height:20px;background:var(--line);margin:0 5px}
.b,select,input[type=number],label{background:transparent;color:var(--fg);border:1px solid transparent;border-radius:6px;padding:5px 8px;font:inherit;cursor:pointer}
.b:hover,label:hover,select:hover{background:#242633}
.b:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc)}
.b.p{background:#2a3566;border-color:#3d4c92}.b.p:hover{background:#34428a}
select{border-color:var(--line);background:var(--panel)}
input[type=number]{width:56px;border-color:var(--line);cursor:text}
label{display:inline-flex;align-items:center;gap:6px}
input[type=color]{width:24px;height:22px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer}
input[type=range]{width:80px;accent-color:var(--acc)}
#main{flex:1;display:flex;min-height:0}
#wrap{flex:1;overflow:auto;padding:26px 16px 60px}
#ed{outline:none;background:var(--paper);color:var(--ink);max-width:840px;min-height:75vh;margin:0 auto;padding:56px 64px;border-radius:10px;border:1px solid var(--line);font:18px/1.75 Georgia,serif;overflow-wrap:anywhere}
#ed p,#ed h1,#ed h2,#ed h3,#ed blockquote{margin:0 0 .6em}
#ed blockquote{border-left:3px solid #666;padding-left:14px;opacity:.9}
::selection{background:#5a78ff77}
.cm{text-decoration:underline wavy var(--squig);text-decoration-thickness:1px;text-underline-offset:4px;cursor:help}
.gp{box-shadow:inset 0 -2px 0 hsl(var(--h) 75% 62%)}
.gp.last::after{content:"[" attr(data-g) "]";font:600 .6em/1 system-ui,sans-serif;vertical-align:super;color:hsl(var(--h) 80% 68%);margin-left:1px}
#side{width:290px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px}
#side h3{margin:4px 0 8px;font-size:13px;color:var(--mut);font-weight:600}
#side h4{margin:12px 0 4px;font-size:13px}
.it{padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:#1a1c24}
.it:hover{border-color:var(--acc)}
.it q{display:block;quotes:none;font-style:italic}.it small{color:var(--mut)}
.empty{color:var(--mut);font-size:13px}
#st{background:var(--panel);border-top:1px solid var(--line);padding:5px 12px;color:var(--mut);font-size:12px;display:flex;gap:16px}
#tip{position:fixed;display:none;z-index:50;max-width:280px;background:#0b0c10;border:1px solid #3a3f55;color:#fff;padding:8px 11px;border-radius:8px;font:13px/1.4 system-ui,sans-serif;white-space:pre-wrap;pointer-events:none;box-shadow:0 8px 24px #0008}
#cmenu{position:fixed;display:none;z-index:60;min-width:210px;background:#1b1d26;border:1px solid #3a3f55;border-radius:10px;padding:5px;box-shadow:0 12px 32px #000a}
#cmenu div{padding:7px 11px;border-radius:6px;cursor:pointer}#cmenu div:hover{background:#2c3350}
#cmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#dlg{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:70}
#dlg .card{background:#1b1d26;border:1px solid #3a3f55;border-radius:12px;padding:16px;width:min(420px,92vw)}
#dlg textarea{width:100%;height:96px;margin:10px 0;background:#0f1015;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;resize:vertical}
#dlg .acts{display:flex;justify-content:flex-end;gap:6px}
#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:#2a3566;border:1px solid #3d4c92;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:80}
@media(max-width:820px){#side{display:none}#ed{padding:28px 20px}}
</style></head><body>
<div id="tb">
 <div class="row">
  <button class="b" data-x="undo" title="Undo">↶</button><button class="b" data-x="redo" title="Redo">↷</button><i></i>
  <select id="blk" title="Block style"><option value="p">Paragraph</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="blockquote">Quote</option></select>
  <select id="fam" title="Font"><option>Georgia</option><option>Arial</option><option>Verdana</option><option>Trebuchet MS</option><option>Times New Roman</option><option>Courier New</option></select>
  <button class="b" id="sm" title="Smaller">A−</button><input id="sz" type="number" min="6" max="200" value="18" title="Size in px (select text, then press Enter)"><button class="b" id="sp" title="Bigger">A+</button><i></i>
  <button class="b" data-x="bold" title="Bold"><b>B</b></button><button class="b" data-x="italic" title="Italic"><i style="all:unset;font-style:italic">I</i></button><button class="b" data-x="underline" title="Underline"><u>U</u></button><button class="b" data-x="strikeThrough" title="Strikethrough"><s>S</s></button><i></i>
  <label title="Text color">A<input type="color" id="fg" value="#ff7a7a"></label>
  <label title="Highlight (text background)">▮<input type="color" id="bg" value="#ffd84d"></label>
  <button class="b" id="nobg" title="Remove highlight">⌫</button>
  <label title="Text opacity">◐<input type="range" id="op" min="5" max="100" value="100"></label><i></i>
  <button class="b" data-x="justifyLeft" title="Align left">☰</button><button class="b" data-x="justifyCenter" title="Center">≡</button><button class="b" data-x="justifyRight" title="Align right">☷</button>
  <button class="b" data-x="insertUnorderedList" title="Bullets">• List</button><button class="b" data-x="insertOrderedList" title="Numbers">1. List</button>
  <button class="b" id="clr" title="Clear formatting">Clear</button>
 </div>
 <div class="row">
  <button class="b" id="bcm" title="Comment on selection (Ctrl+Alt+M)">💬 Comment</button>
  <button class="b" id="ucm" title="Remove comment">Uncomment</button><i></i>
  <button class="b" id="bgp" title="New group from selection (Ctrl+Alt+G)">⧉ New group</button>
  <select id="gsel" title="Add selection to an existing group"></select>
  <button class="b" id="ugp" title="Remove from group">Ungroup</button><i></i>
  <label title="Paper color">Paper <input type="color" id="paper" value="#1a1b21"></label><i></i>
  <button class="b p" id="cpl">Copy plain text</button>
  <button class="b p" id="cdoc">Copy for Google Docs</button>
  <button class="b" id="dh">⬇ HTML</button><button class="b" id="dt">⬇ TXT</button>
  <button class="b" id="new">New</button>
 </div>
</div>
<div id="main">
 <div id="wrap"><div id="ed" contenteditable="true" spellcheck="true"></div></div>
 <aside id="side"></aside>
</div>
<div id="st"><span id="s1"></span><span id="s2"></span><span style="margin-left:auto">Right-click selected text for comments &amp; groups</span></div>
<div id="tip"></div><div id="cmenu"></div><div id="toast"></div>
<div id="dlg"><div class="card"><b id="dtt"></b><textarea id="dtx" placeholder="Write a comment…"></textarea><div class="acts"><button class="b" id="dno">Cancel</button><button class="b p" id="dok">Save</button></div></div></div>
<script>
const $=s=>document.querySelector(s),ed=$('#ed');
let saved=null,uid=0,J=[];
const nid=()=>Date.now().toString(36)+(uid++);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,1800)}

/* ---------- selection ---------- */
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&ed.contains(s.anchorNode)){saved=s.getRangeAt(0).cloneRange();const el=s.anchorNode.nodeType==3?s.anchorNode.parentElement:s.anchorNode;if(el.closest&&el.closest('#ed'))$('#sz').value=parseInt(getComputedStyle(el).fontSize)}});
function rng(need=true){if(!saved||(need&&saved.collapsed)){toast('Select some text first');return null}const s=getSelection(),r=saved.cloneRange();s.removeAllRanges();s.addRange(r.cloneRange());return r}
function ex(c,v){if(saved){const s=getSelection();s.removeAllRanges();s.addRange(saved.cloneRange())}ed.focus();document.execCommand(c,false,v);sync()}

/* ---------- wrapping engine: split text nodes, wrap each, isolate same-class ancestors ---------- */
function nodes(r){
 let sc=r.startContainer,so=r.startOffset,ec=r.endContainer,eo=r.endOffset;
 if(ec.nodeType==3&&eo<ec.length)ec.splitText(eo);
 if(sc.nodeType==3&&so>0){const n=sc.splitText(so);if(sc===ec)ec=n;sc=n}
 const r2=document.createRange();
 sc.nodeType==3?r2.setStartBefore(sc):r2.setStart(sc,so);
 ec.nodeType==3?r2.setEndAfter(ec):r2.setEnd(ec,eo);
 const root=r2.commonAncestorContainer,out=[];
 if(root.nodeType==3)return[root];
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 for(let n=w.nextNode();n;n=w.nextNode())if(n.length&&r2.intersectsNode(n)&&!(/^\s*$/.test(n.nodeValue)&&n.nodeValue.includes('\n')))out.push(n);
 return out}
function isolate(n,sel){const a=n.parentElement.closest(sel);if(!a||!ed.contains(a))return;
 const r=document.createRange();
 r.setStartBefore(a);r.setEndBefore(n);a.before(r.extractContents());
 r.setStartAfter(n);r.setEndAfter(a);a.after(r.extractContents())}
function clean(){ed.querySelectorAll('span').forEach(s=>{if(!s.textContent&&!s.querySelector('br,img'))s.remove()})}
function mark(cls,fn,r){r=r||rng();if(!r)return;const ns=nodes(r),sel='span.'+cls;
 ns.forEach(n=>{isolate(n,sel);let s=n.parentElement.closest(sel);if(!s||!ed.contains(s)){s=document.createElement('span');s.className=cls;n.replaceWith(s);s.append(n)}fn(s)});
 clean();if(ns.length){const r2=document.createRange();r2.setStartBefore(ns[0]);r2.setEndAfter(ns[ns.length-1]);saved=r2}sync()}
function unmark(cls,r){r=r||rng();if(!r)return;const sel='span.'+cls;
 nodes(r).forEach(n=>{isolate(n,sel);const s=n.parentElement.closest(sel);if(s&&ed.contains(s))s.replaceWith(...s.childNodes)});clean();sync()}
function strip(cls,el){
 if(!el&&saved&&!saved.collapsed){unmark(cls);return}
 const p=saved&&saved.startContainer;el=el||(p&&(p.nodeType==3?p.parentElement:p).closest('span.'+cls));
 if(!el)return toast('Nothing to remove here');
 ed.querySelectorAll('span.'+cls+'[data-id="'+el.dataset.id+'"]').forEach(s=>s.replaceWith(...s.childNodes));sync()}

/* ---------- comments & groups ---------- */
function ask(title,val){return new Promise(res=>{const d=$('#dlg'),t=$('#dtx');$('#dtt').textContent=title;t.value=val||'';d.style.display='grid';t.focus();
 const done=v=>{d.style.display='none';$('#dok').onclick=$('#dno').onclick=t.onkeydown=null;res(v)};
 $('#dok').onclick=()=>done(t.value.trim());$('#dno').onclick=()=>done(null);
 t.onkeydown=e=>{if(e.key=='Escape')done(null);if(e.key=='Enter'&&(e.ctrlKey||e.metaKey))done(t.value.trim())}})}
function addComment(el){
 if(el&&el.nodeType){ask('Edit comment',el.dataset.c).then(v=>{if(v===null)return;if(!v)return strip('cm',el);ed.querySelectorAll('.cm[data-id="'+el.dataset.id+'"]').forEach(s=>s.dataset.c=v);sync()});return}
 const r=rng();if(!r)return;
 ask('Add comment','').then(v=>{if(!v)return;const id=nid();mark('cm',s=>{s.dataset.id=id;s.dataset.c=v},r)})}
const groupNums=()=>[...new Set([...ed.querySelectorAll('.gp')].map(e=>+e.dataset.g))].sort((a,b)=>a-b);
function addGroup(n){const r=rng();if(!r)return;
 if(!n){const u=groupNums();n=1;while(u.includes(n))n++}
 const id=nid();mark('gp',s=>{s.dataset.g=n;s.dataset.id=id;s.style.setProperty('--h',(n*67)%360)},r)}

/* ---------- apply formatting ---------- */
const applySize=v=>{v=Math.max(6,Math.min(200,+v||18));mark('sz',s=>s.style.fontSize=v+'px')};
$('#sz').onchange=e=>applySize(e.target.value);
$('#sm').onclick=()=>applySize((+$('#sz').value)-2);$('#sp').onclick=()=>applySize((+$('#sz').value)+2);
$('#op').oninput=e=>{const v=+e.target.value;mark('op',s=>v>=100?s.style.removeProperty('opacity'):s.style.opacity=v/100)};
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>ex(b.dataset.x));
$('#blk').onchange=e=>ex('formatBlock',e.target.value);$('#fam').onchange=e=>ex('fontName',e.target.value);
$('#fg').oninput=e=>ex('foreColor',e.target.value);$('#bg').oninput=e=>ex('hiliteColor',e.target.value);
$('#nobg').onclick=()=>ex('hiliteColor','transparent');
$('#clr').onclick=()=>{if(saved&&!saved.collapsed){unmark('op');unmark('sz')}ex('removeFormat')};
$('#bcm').onclick=()=>addComment();$('#ucm').onclick=()=>strip('cm');
$('#bgp').onclick=()=>addGroup();$('#ugp').onclick=()=>strip('gp');
$('#gsel').onchange=e=>{if(e.target.value)addGroup(+e.target.value);e.target.value=''};
$('#tb').addEventListener('mousedown',e=>{if(!/INPUT|SELECT|OPTION/.test(e.target.tagName)&&!e.target.closest('label'))e.preventDefault()});
ed.addEventListener('keydown',e=>{if(e.ctrlKey&&e.altKey&&e.code=='KeyM'){e.preventDefault();addComment()}if(e.ctrlKey&&e.altKey&&e.code=='KeyG'){e.preventDefault();addGroup()}});
ed.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))});
ed.addEventListener('input',sync);

/* ---------- paper ---------- */
function setPaper(c){const n=parseInt(c.slice(1),16),l=(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255,R=document.documentElement.style;
 R.setProperty('--paper',c);R.setProperty('--ink',l>.5?'#1c1c22':'#e9e9ef');R.setProperty('--squig',l>.5?'#222':'#fff');$('#paper').value=c;try{localStorage.setItem('mts-paper',c)}catch{}}
$('#paper').oninput=e=>setPaper(e.target.value);

/* ---------- context menu & tooltip ---------- */
const cmenu=$('#cmenu'),tip=$('#tip');
const hide=()=>cmenu.style.display='none';
function menu(x,y,items){cmenu.innerHTML='';items.forEach(it=>{if(!it){cmenu.append(document.createElement('hr'));return}const d=document.createElement('div');d.textContent=it[0];d.onclick=()=>{hide();it[1]()};cmenu.append(d)});
 cmenu.style.display='block';cmenu.style.left=Math.min(x,innerWidth-230)+'px';cmenu.style.top=Math.max(4,Math.min(y,innerHeight-cmenu.offsetHeight-8))+'px'}
ed.addEventListener('contextmenu',e=>{e.preventDefault();tip.style.display='none';
 const sel=saved&&!saved.collapsed,c=e.target.closest('.cm'),g=e.target.closest('.gp'),it=[];
 if(sel)it.push(['💬 Add comment',()=>addComment()]);
 if(c)it.push(['✏️ Edit comment',()=>addComment(c)],['🗑 Remove comment',()=>strip('cm',c)]);
 if(sel||c)it.push(null);
 if(sel){it.push(['⧉ New group from selection',()=>addGroup()]);groupNums().forEach(n=>it.push(['➕ Add to group '+n,()=>addGroup(n)]))}
 if(g)it.push(['➖ Remove from group '+g.dataset.g,()=>strip('gp',g)]);
 if(sel)it.push(null,['Opacity 50%',()=>mark('op',s=>s.style.opacity=.5)],['Opacity 100%',()=>mark('op',s=>s.style.removeProperty('opacity'))]);
 it.push(null,['Copy plain text',copyPlain],['Copy for Google Docs',copyDocs]);
 menu(e.clientX,e.clientY,it)});
document.addEventListener('mousedown',e=>{if(!cmenu.contains(e.target))hide()});
cmenu.addEventListener('mousedown',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key=='Escape')hide()});
$('#wrap').addEventListener('scroll',hide);
ed.addEventListener('mousemove',e=>{const c=e.target.closest&&e.target.closest('.cm');
 if(!c||cmenu.style.display=='block'){tip.style.display='none';return}
 tip.textContent=c.dataset.c;tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-300)+'px';tip.style.top=(e.clientY+18)+'px'});
ed.addEventListener('mouseleave',()=>tip.style.display='none');

/* ---------- sidebar & status ---------- */
function marks(){ed.querySelectorAll('.last').forEach(e=>e.classList.remove('last'));const m={};ed.querySelectorAll('span.gp').forEach(e=>m[e.dataset.id]=e);Object.values(m).forEach(e=>e.classList.add('last'))}
function side(){
 const cm={},gp={};J=[];
 ed.querySelectorAll('span.cm').forEach(e=>{const o=cm[e.dataset.id]??={el:e,c:e.dataset.c,t:''};o.t+=e.textContent});
 ed.querySelectorAll('span.gp').forEach(e=>{const g=e.dataset.g;gp[g]??={};const o=gp[g][e.dataset.id]??={el:e,t:''};o.t+=e.textContent});
 const it=(el,h)=>{J.push(el);return`<div class="it" data-j="${J.length-1}">${h}</div>`};
 const cl=Object.values(cm),gk=Object.keys(gp).sort((a,b)=>a-b);
 let h=`<h3>Comments (${cl.length})</h3>`+(cl.map(o=>it(o.el,`<q>${esc(o.t)}</q><small>${esc(o.c)}</small>`)).join('')||'<div class="empty">Select text, right-click, Add comment.</div>');
 h+=`<h3 style="margin-top:18px">Groups (${gk.length})</h3>`;
 h+=gk.map(g=>`<h4 style="color:hsl(${(g*67)%360} 80% 70%)">Group ${g}</h4>`+Object.values(gp[g]).map(o=>it(o.el,`<q>${esc(o.t)}</q>`)).join('')).join('')||'<div class="empty">Groups tag related pieces as [1], [2]… in plain-text copies.</div>';
 $('#side').innerHTML=h;
 $('#gsel').innerHTML='<option value="">Add to group…</option>'+gk.map(g=>`<option>${g}</option>`).join('')}
$('#side').onclick=e=>{const i=e.target.closest('.it');if(!i)return;const el=J[+i.dataset.j];el.scrollIntoView({block:'center',behavior:'smooth'});el.animate([{outline:'2px solid #8aa4ff'},{outline:'2px solid transparent'}],{duration:1400})};
let sv;function sync(){marks();side();const t=ed.innerText.trim();
 $('#s1').textContent=(t?t.split(/\s+/).length:0)+' words · '+t.length+' chars';
 $('#s2').textContent=ed.querySelectorAll('.cm').length?'':'';clearTimeout(sv);sv=setTimeout(()=>{try{localStorage.setItem('mts-doc',ed.innerHTML)}catch{}},400)}

/* ---------- export ---------- */
const BLK=/^(DIV|P|H[1-6]|LI|BLOCKQUOTE)$/;
const isLast=(c,cls,root)=>{const a=root.querySelectorAll('.'+cls+'[data-id="'+c.dataset.id+'"]');return a[a.length-1]===c};
function ser(n,root){let s='';n.childNodes.forEach(c=>{
 if(c.nodeType==3){s+=c.nodeValue;return}if(c.nodeType!=1)return;
 if(c.tagName=='BR'){if(c.parentNode.childNodes.length>1)s+='\n';return}
 let t=ser(c,root);
 if(c.classList.contains('cm')&&isLast(c,'cm',root))t+=' ('+c.dataset.c+')';
 if(c.classList.contains('gp')&&isLast(c,'gp',root))t+='['+c.dataset.g+']';
 if(c.tagName=='LI')t='• '+t;
 if(BLK.test(c.tagName))t+='\n';
 s+=t});return s}
const plain=()=>ser(ed,ed).replace(/\u00a0/g,' ').replace(/\n{3,}/g,'\n\n').trim();
function docsHTML(){
 const base=getComputedStyle(ed).color;
 const ops=[...ed.querySelectorAll('.op')].map(e=>{const cs=getComputedStyle(e).color,o=parseFloat(e.style.opacity||1),m=cs==base?[0,0,0]:cs.match(/[\d.]+/g).map(Number);return'rgb('+m.slice(0,3).map(v=>Math.round(v*o+255*(1-o))).join(',')+')'});
 const c=ed.cloneNode(true);c.removeAttribute('id');
 c.querySelectorAll('.op').forEach((e,i)=>{e.style.opacity='';e.style.color=ops[i]});
 c.querySelectorAll('.cm').forEach(e=>{e.style.textDecoration='underline';if(isLast(e,'cm',c))e.insertAdjacentHTML('afterend','<span style="color:#6b7280;font-style:italic"> ('+esc(e.dataset.c)+')</span>')});
 c.querySelectorAll('.gp').forEach(e=>{if(isLast(e,'gp',c))e.insertAdjacentHTML('afterend','<sup>['+e.dataset.g+']</sup>')});
 return'<meta charset="utf-8"><div style="color:#000;font-family:Georgia,serif">'+c.innerHTML+'</div>'}
function copyData(html,txt){let ok=false;const f=e=>{e.clipboardData.setData('text/plain',txt);if(html)e.clipboardData.setData('text/html',html);e.preventDefault();ok=true};
 document.addEventListener('copy',f);try{document.execCommand('copy')}catch{}document.removeEventListener('copy',f);
 if(ok)return Promise.resolve();
 return(html&&window.ClipboardItem?navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([txt],{type:'text/plain'})})]):navigator.clipboard.writeText(txt))}
const copyPlain=()=>copyData(null,plain()).then(()=>toast('Plain text copied'),()=>toast('Copy blocked by the browser'));
const copyDocs=()=>copyData(docsHTML(),plain()).then(()=>toast('Copied. Paste into Google Docs (Ctrl+V)'),()=>toast('Copy blocked by the browser'));
$('#cpl').onclick=copyPlain;$('#cdoc').onclick=copyDocs;
function dl(name,type,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),999)}
$('#dt').onclick=()=>dl('document.txt','text/plain',plain());
$('#dh').onclick=()=>{const c=ed.cloneNode(true);c.removeAttribute('id');c.removeAttribute('contenteditable');c.querySelectorAll('.cm').forEach(e=>e.title=e.dataset.c);
 const cs=getComputedStyle(document.documentElement);
 dl('document.html','text/html','<!DOCTYPE html><meta charset="utf-8"><title>Document</title><style>body{background:'+cs.getPropertyValue('--paper')+';color:'+cs.getPropertyValue('--ink')+';font:18px/1.75 Georgia,serif;max-width:800px;margin:40px auto;padding:0 20px}.cm{text-decoration:underline wavy '+cs.getPropertyValue('--squig')+';text-underline-offset:4px;cursor:help}.gp{box-shadow:inset 0 -2px 0 hsl(var(--h) 75% 62%)}.gp.last::after{content:"[" attr(data-g) "]";font-size:.6em;vertical-align:super}</style>'+c.innerHTML)};
$('#new').onclick=()=>{if(confirm('Clear the whole document?')){ed.innerHTML='<p><br></p>';sync()}};

/* ---------- boot ---------- */
document.execCommand('styleWithCSS',false,true);document.execCommand('defaultParagraphSeparator',false,'p');
let doc=null;try{doc=localStorage.getItem('mts-doc');const p=localStorage.getItem('mts-paper');if(p)setPaper(p)}catch{}
ed.innerHTML=doc||`<h2>Markup Text Studio</h2>
<p>Select text and right-click to add a comment or a group. Hover a squiggly word to read its note.</p>
<p>What is a <span class="cm" data-id="d1" data-c="It's an animal">Fox</span>?</p>
<p>Hello, I am <span class="gp last" data-g="1" data-id="d2" style="--h:67">John</span>.<br>This is a <span class="gp last" data-g="1" data-id="d3" style="--h:67">test</span>.<br>Is it <span class="gp last" data-g="1" data-id="d4" style="--h:67">okay</span>?</p>
<p>Try <span style="color:#ff7a7a">colors</span>, <span style="background-color:#ffd84d;color:#222">highlights</span>, <span class="sz" style="font-size:30px">sizes</span> and <span class="op" style="opacity:.4">transparent text</span>.</p>`;
sync();
